(function() {
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    const stars = [];
    const STAR_COUNT = 45;
    function resizeCanvas() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.2 + 0.08,
            opacity: Math.random(),
            phase: Math.random() * 2 * Math.PI
        });
    }
    function drawStars(timestamp) {
        ctx.clearRect(0, 0, w, h);
        for (const star of stars) {
            const twinkle = Math.sin(timestamp * 0.0008 * star.speed * 3 + star.phase) * 0.35 + 0.65;
            const alpha = star.opacity * twinkle;
            ctx.fillStyle = `rgba(255,220,160,${alpha})`;
            ctx.fillRect(Math.floor(star.x), Math.floor(star.y), Math.ceil(star.size), Math.ceil(star.size));
        }
        requestAnimationFrame(drawStars);
    }
    requestAnimationFrame(drawStars);

// ========== Xbox/Minecraft 令牌获取流程 ==========
async function getXboxToken(msAccessToken) {
    const res = await fetch("https://user.auth.xboxlive.com/user/authenticate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            Properties: {
                AuthMethod: "RPS",
                SiteName: "user.auth.xboxlive.com",
                RpsTicket: `d=${msAccessToken}`
            },
            RelyingParty: "http://auth.xboxlive.com",
            TokenType: "JWT"
        })
    });
    if (!res.ok) throw new Error("Xbox认证失败");
    return await res.json();
}

async function getXstsToken(xblData) {
    const res = await fetch("https://xsts.auth.xboxlive.com/xsts/authorize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            Properties: {
                SandboxId: "RETAIL",
                UserTokens: [xblData.Token]
            },
            RelyingParty: "rp://api.minecraftservices.com/",
            TokenType: "JWT"
        })
    });
    if (!res.ok) throw new Error("XSTS认证失败");
    const data = await res.json();
    return {
        token: data.Token,
        userHash: data.DisplayClaims.xui[0].uhs
    };
}

async function getMinecraftToken(userHash, xstsToken) {
    const res = await fetch("https://api.minecraftservices.com/authentication/login_with_xbox", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            identityToken: `XBL3.0 x=${userHash};${xstsToken}`
        })
    });
    if (!res.ok) throw new Error("无法获取Minecraft令牌");
    const data = await res.json();
    return data.access_token;
}

async function getMinecraftProfile(mcAccessToken) {
    const res = await fetch("https://api.minecraftservices.com/minecraft/profile", {
        headers: { "Authorization": `Bearer ${mcAccessToken}` }
    });
    if (!res.ok) throw new Error("无法获取玩家档案");
    return await res.json();
}

// ========== 统一登录处理逻辑 ==========
async function processLoginResponse(msResponse) {
    const msToken = msResponse.accessToken;
    const graphRes = await fetch("https://graph.microsoft.com/v1.0/me", { 
        headers: { Authorization: `Bearer ${msToken}` } 
    });
    const msData = await graphRes.json();
    currentMsUser = { 
        displayName: msData.displayName, 
        id: msData.id, 
        email: msData.userPrincipalName 
    };

    // 获取Xbox和Minecraft令牌
    const xblData = await getXboxToken(msToken);
    const xstsData = await getXstsToken(xblData);
    const mcToken = await getMinecraftToken(xstsData.userHash, xstsData.token);
    const profile = await getMinecraftProfile(mcToken);

    // ✅ 这里获取到玩家名字和UUID
    currentMcProfile = { 
        name: profile.name, 
        id: profile.id, // 这就是UUID（无横线格式）
        uuid: formatUuid(profile.id) // 格式化后的带横线UUID
    };

    // 保存登录态
    localStorage.setItem('mc_auth', JSON.stringify({ 
        mcProfile: currentMcProfile, 
        msUser: currentMsUser 
    }));

    updateUserUI();
}

// ✅ 格式化UUID（将无横线转为带横线格式）
function formatUuid(plainId) {
    return plainId.replace(
        /^(.{8})(.{4})(.{4})(.{4})(.{12})$/,
        '$1-$2-$3-$4-$5'
    );
}

// ========== 登录按钮点击事件 ==========
async function doLogin() {
    if (mcLoginBtn.disabled) return;
    mcLoginBtn.disabled = true;
    mcLoginBtn.textContent = "正在认证…";
    try {
        // 先尝试弹窗登录
        const msResponse = await msalInstance.loginPopup(loginRequest);
        await processLoginResponse(msResponse);
    } catch (err) {
        console.error(err);
        // 弹窗被拦截/失败时，自动使用重定向登录
        if (err.errorCode === "popup_window_error" || 
            err.errorCode === "user_interaction_required" ||
            err.message.includes("popup")) {
            await msalInstance.loginRedirect(loginRequest);
            return;
        }
        // 友好错误提示
        let friendlyMsg = "";
        const msg = err.message || "";
        const code = err.errorCode || "";
        if (msg.includes("User cancelled") || code === "user_cancelled") {
            friendlyMsg = "你已取消登录，请重新尝试。";
        } else if (msg.includes("Xbox认证失败") || msg.includes("XErr")) {
            friendlyMsg = "Xbox 认证失败，请确保你的微软账号拥有 Minecraft Java 版。";
        } else if (msg.includes("XSTS认证失败")) {
            friendlyMsg = "XSTS 认证失败，请稍后重试。";
        } else if (msg.includes("Minecraft令牌")) {
            friendlyMsg = "无法获取 Minecraft 令牌，请确保你的账号已购买 Minecraft Java 版。";
        } else if (msg.includes("玩家档案")) {
            friendlyMsg = "无法获取玩家档案，请确保你的账号已迁移并拥有 Java 版。";
        } else if (msg.includes("NetworkError") || msg.includes("fetch")) {
            friendlyMsg = "网络错误，请检查网络后重试。";
        } else {
            friendlyMsg = "登录失败：" + msg;
        }
        alert(friendlyMsg);
    } finally {
        mcLoginBtn.disabled = false;
        mcLoginBtn.textContent = "⛏️ 冒险者认证";
    }
}

const serverAddress = 'mcqk.cn';

async function checkServerStatus() {
    function showOnline(online, max) {
        statusDot.style.background = '#5a5';
        statusDot.style.boxShadow = '0 0 10px #5a5';
        statusText.textContent = '生机勃勃';
        if (typeof online === 'number' && online > 0 && typeof max === 'number') {
            playerTag.style.display = 'flex';
            playerText.textContent = `${online} / ${max}`;
            if (online >= max) playerText.style.color = '#ff9999';
            else if (online > max * 0.7) playerText.style.color = '#ffcc66';
            else playerText.style.color = '#99ff99';
        } else if (typeof online === 'number' && online > 0) {
            playerTag.style.display = 'flex';
            playerText.textContent = `${online} 人在线`;
            playerText.style.color = '#99ff99';
        } else {
            playerTag.style.display = 'flex';
            playerText.textContent = '旅者隐匿';
            playerText.style.color = '#888';
        }
    }
    function showOffline() {
        statusDot.style.background = '#c55';
        statusDot.style.boxShadow = '0 0 10px #c55';
        statusText.textContent = '黯蚀笼罩';
        playerTag.style.display = 'none';
    }
    function showError() {
        statusDot.style.background = '#888';
        statusDot.style.boxShadow = '0 0 6px #888';
        statusText.textContent = '感知受阻';
        playerTag.style.display = 'none';
    }
    async function fetchJSON(url) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        try {
            const res = await fetch(url, { signal: controller.signal });
            clearTimeout(timeout);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } catch (err) {
            return null;
        }
    }
    const data = await fetchJSON(`https://api.mcstatus.io/v2/status/java/${serverAddress}`);
    if (!data) {
        showError();
        return;
    }
    if (data.online) {
        const online = data.players?.online;
        const max = data.players?.max;
        showOnline(online, max);
    } else {
        showOffline();
    }
}

const flashConfig = {
    autoFlashProbability: 0.03,
    clickFlashProbability: 0.5,
    checkIntervalMin: 15000,
    checkIntervalMax: 30000,
    flashDuration: 1000
};

const SEASON_KEY = { spring: "浅草", summer: "流萤", autumn: "落照", winter: "寒酥" };
const FULL_KEY = SEASON_KEY.spring + SEASON_KEY.summer + SEASON_KEY.autumn + SEASON_KEY.winter;
let flashTimer = null;
let originalTitleText = null;

function getSeasonPrefix(season) { 
    const m = { spring: "古神低语", summer: "遗迹回响", autumn: "虚空铭文", winter: "命运启示" }; 
    return m[season] || "天启"; 
}
function getCurrentSeasonForFlash() { 
    const m = new Date().getMonth() + 1; 
    if (m >= 3 && m <= 5) return 'spring'; 
    if (m >= 6 && m <= 8) return 'summer'; 
    if (m >= 9 && m <= 11) return 'autumn'; 
    return 'winter'; 
}
function flashSeasonKey() {
    if (flashTimer) return;
    const season = getCurrentSeasonForFlash();
    const key = SEASON_KEY[season];
    if (!key) return;
    
    originalTitleText = mainTitle.textContent;
    mainTitle.textContent = `${getSeasonPrefix(season)}·${key}`;
    mainTitle.style.opacity = '1';
    
    flashTimer = setTimeout(() => { 
        if (originalTitleText) { 
            mainTitle.textContent = originalTitleText; 
            originalTitleText = null; 
        } 
        flashTimer = null; 
    }, flashConfig.flashDuration);
}

function startAutoFlash() {
    const interval = flashConfig.checkIntervalMin + Math.random() * (flashConfig.checkIntervalMax - flashConfig.checkIntervalMin);
    setTimeout(() => {
        if (Math.random() < flashConfig.autoFlashProbability) {
            flashSeasonKey();
        }
        startAutoFlash();
    }, interval);
}
startAutoFlash();

const seasonTitles = {
    spring: ['星牧·初芽','星牧·绿潮','星牧·花咒','星牧·春醒','星牧·林径','星牧·小晴空','星牧·荆棘冠','星牧·复苏歌','星牧·鹿鸣涧','星牧·迷雾种','星牧·风之信标','星牧·生命祭坛','星牧·原初之息','星牧·翠色协议','星牧·破晓远征'],
    summer: ['星牧·炎息','星牧·沙暴','星牧·熔核','星牧·烈芒','星牧·雷鼓','星牧·火蛇舞','星牧·小晴空','星牧·龙巢热','星牧·雷暴核','星牧·蝉剑鸣','星牧·烈日祭坛','星牧·赤沙遗迹','星牧·炎魔之眼','星牧·雷云堡垒','星牧·狂战士营'],
    autumn: ['星牧·金雨','星牧·枯骨','星牧·猎月','星牧·丰碑','星牧·锈刃','星牧·亡者醉','星牧·金币叶','星牧·小晴空','星牧·凋零颂','星牧·黄昏猎','星牧·丰收祭典','星牧·魂引灯笼','星牧·堕落王座','星牧·秘银落叶','星牧·暮光决斗'],
    winter: ['星牧·霜卫','星牧·永夜','星牧·寒渊','星牧·冰棘','星牧·寂塔','星牧·冰龙息','星牧·小晴空','星牧·极光剑','星牧·雪怪嚎','星牧·落幕曲','星牧·冰封王座','星牧·凛冬领主','星牧·永夜庇护所','星牧·极光魔杖','星牧·最终誓约']
};

const remainingIndexes = {
    spring: [],
    summer: [],
    autumn: [],
    winter: []
};

function getCurrentSeason() {
    const m = new Date().getMonth() + 1;
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
}

function rotateTitle() {
    const currentSeason = getCurrentSeason();
    const titles = seasonTitles[currentSeason];
    
    if (remainingIndexes[currentSeason].length === 0) {
        remainingIndexes[currentSeason] = Array.from({ length: titles.length }, (_, i) => i);
    }
    
    const randomPos = Math.floor(Math.random() * remainingIndexes[currentSeason].length);
    const selectedIndex = remainingIndexes[currentSeason].splice(randomPos, 1)[0];
    
    mainTitle.style.opacity = 0;
    setTimeout(() => {
        mainTitle.textContent = titles[selectedIndex];
        mainTitle.style.opacity = 1;
    }, 600);
}

setInterval(rotateTitle, 2000);
})();
</script>
